# These listeners must never bind a public or LAN interface.
bindAddr = "127.0.0.1"
bindPort = 3222
proxyBindAddr = "127.0.0.1"
vhostHTTPPort = 3223
maxPortsPerClient = 1
log.to = "console"
log.level = "warn"

[[httpPlugins]]
name = "stillon-connect"
addr = "127.0.0.1:3221"
path = "/plugin"
ops = ["Login", "NewProxy", "Ping", "NewWorkConn"]
