name: Connect integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run prepare:connect-runtime --server
      - run: bun scripts/build-connect.ts
      - name: Verify CLI updates through local and authenticated Connect entries
        run: bun scripts/test-connect-provider-cli-updates.ts --cloud-package=dist/connect-service
      - name: Verify the packaged cloud with two isolated computers
        run: bun scripts/test-connect-transport.ts --cloud-package=dist/connect-service
      - name: Verify dynamic previews with a real development server
        run: bun scripts/test-connect-dynamic-preview.ts --cloud-package=dist/connect-service
