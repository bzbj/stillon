name: Build independent Connect components

on:
  workflow_dispatch:
    inputs:
      download-base:
        description: Immutable HTTPS release URL where these component files will be published
        type: string
        required: true
      require-signing:
        description: Sign helpers and notarize the macOS component packages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            architecture: x64
          - os: macos-15
            platform: darwin
            architecture: arm64
          - os: windows-latest
            platform: win32
            architecture: x64
          - os: windows-11-arm
            platform: win32
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      STILLON_REQUIRE_SIGNING: ${{ inputs.require-signing && '1' || '0' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && inputs.require-signing
        run: bash scripts/prepare-macos-signing.sh
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Build the immutable component and pinned descriptor
        shell: pwsh
        run: bun scripts/build-frp-component.ts "--download-base=$env:COMPONENT_DOWNLOAD_BASE"
        env:
          COMPONENT_DOWNLOAD_BASE: ${{ inputs.download-base }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ inputs.require-signing && 'stillon-ci' || '' }}
          WINDOWS_SIGN_SCRIPT: scripts/sign-windows.ps1
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connect-component-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/connect-components/*
          if-no-files-found: error
          compression-level: 0
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && inputs.require-signing
        run: security delete-keychain "$RUNNER_TEMP/stillon-signing.keychain-db" || true
