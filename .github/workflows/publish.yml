name: Build release assets

on:
  release:
    types: [published]

jobs:
  desktop:
    needs: publish
    if: "${{ !contains(github.event.release.body, '<!-- stillon-release: source-only -->') }}"
    uses: ./.github/workflows/desktop.yml
    with:
      require-signing: false
      require-connect: true
      connect-origin: ${{ vars.STILLON_CONNECT_ORIGIN }}
      connect-migrate-from-origins: ${{ vars.STILLON_CONNECT_MIGRATE_FROM_ORIGINS || '[]' }}
    secrets: inherit

  publish-desktop:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:verify -- "${{ github.event.release.tag_name }}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/desktop/release
      - run: bun scripts/assemble-desktop-release.ts
      - name: Upload verified installers and runtimes, then commit the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/desktop/release/*.tar.gz dist/desktop/release/*.dmg dist/desktop/release/*-setup.exe
          gh release upload "$RELEASE_TAG" dist/desktop/release/stillon-release.json

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: bun run release:verify -- "${{ github.event.release.tag_name }}"

      - name: Validate managed Connect release configuration
        if: "${{ !contains(github.event.release.body, '<!-- stillon-release: source-only -->') }}"
        run: bun -e "import { desktopConnectConfig } from './src/server/connect/config'; desktopConnectConfig(process.env)"
        env:
          STILLON_REQUIRE_CONNECT: '1'
          STILLON_CONNECT_ORIGIN: ${{ vars.STILLON_CONNECT_ORIGIN }}
          STILLON_CONNECT_MIGRATE_FROM_ORIGINS: ${{ vars.STILLON_CONNECT_MIGRATE_FROM_ORIGINS || '[]' }}

      - run: bun run check

      - run: bun run test

      - run: bun run audit

      - run: bun run prepare:export-viewer-release-assets

      - name: Upload export viewer release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/export-viewer-release-assets/* --clobber
