name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify the actual Bun architecture
        run: bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch'); console.log(process.platform + '/' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

      - run: bun run check

      - run: bun run test

      - name: Verify isolated CLI update and App Server lifecycle
        run: bun scripts/test-provider-cli-updates.ts

      - name: Rehearse native Windows updater recovery
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: bun scripts/rehearse-managed-updates-windows.ts

      - run: bun run audit

  async-answer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run test:async-answer:browser
      - run: bun run test:remote-auth:browser
      - run: bun run test:remote-auth:browser --firefox

  workspace-preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STILLON_PREVIEW_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run check
      - run: bun run prepare:connect-runtime --server
      - name: Exercise preview leases, HMR, pause and logout over real frp
        run: bun scripts/test-connect-dynamic-preview.ts
      - name: Exercise local and authenticated Connect preview interfaces
        run: bun run test:previews:browser
      - name: Recheck document navigation with Firefox
        run: bun run test:previews:browser --firefox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-preview-evidence
          path: |
            test-artifacts/workspace-previews/api-results.json
            test-artifacts/workspace-previews/browser-results.json
            test-artifacts/workspace-previews/browser-results-*.json
            test-artifacts/workspace-previews/*-sidebar.png
            test-artifacts/workspace-previews/*-standalone.png
            test-artifacts/workspace-previews/*-outside-html.jpg
            test-artifacts/workspace-previews/*-recovery-*.jpg

  workspace-preview-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Recheck fresh native service discovery
        run: bun scripts/verify-preview-discovery.ts --scans=10
      - name: Exercise Edge input, drag and service-list interfaces
        run: bun run test:previews:browser --local-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-preview-windows-evidence
          path: |
            test-artifacts/preview-discovery-results.json
            test-artifacts/workspace-previews/api-results.json
            test-artifacts/workspace-previews/browser-results*.json
            test-artifacts/workspace-previews/*-input-sidebar.png
            test-artifacts/workspace-previews/*-input-standalone.png
