name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify the actual Bun architecture
        run: bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch'); console.log(process.platform + '/' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

      - run: bun run check

      - run: bun run test

      - name: Rehearse native Windows updater recovery
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: bun scripts/rehearse-managed-updates-windows.ts

      - run: bun run audit

  async-answer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Diagnose Windows process startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command node, powershell.exe, conhost.exe | Format-List Source,Version
          node --version
          node -p "process.arch"
          bun -e 'const p=Bun.spawn(["node","-e","console.log(process.execPath,process.arch)"],{stdout:"pipe",stderr:"pipe"}); console.log(await new Response(p.stdout).text(),await new Response(p.stderr).text(),await p.exited)'

      - run: bun run test:async-answer:browser

  windows-startup-diagnostic:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - shell: pwsh
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP ('stillon-startup-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $taskRoot | Out-Null
          $long = Join-Path $taskRoot ('x' * (235 - $taskRoot.Length - 1))
          New-Item -ItemType Directory -Path $long | Out-Null
          foreach ($cwd in @($taskRoot, $long)) {
            foreach ($style in @('hidden', 'plain')) {
              $out = Join-Path $taskRoot ([guid]::NewGuid().ToString() + '.txt')
              $script = "[IO.File]::WriteAllText('$out','started')"
              $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
              $extra = if ($style -eq 'hidden') { '-WindowStyle Hidden' } else { '' }
              $watch = [Diagnostics.Stopwatch]::StartNew()
              $proc = Start-Process -FilePath "$env:SystemRoot\System32\conhost.exe" -ArgumentList "--headless powershell.exe -NoLogo $extra -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded" -WorkingDirectory $cwd -WindowStyle Hidden -PassThru
              $done = $proc.WaitForExit(20000)
              Write-Host "cwdLength=$($cwd.Length) style=$style exited=$done ready=$(Test-Path $out) elapsed=$($watch.ElapsedMilliseconds)"
              if (!$done) {
                Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $proc.Id -or $_.ParentProcessId -eq $proc.Id } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | ConvertTo-Json
                taskkill.exe /PID $proc.Id /T /F
              }
            }
          }
