name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify the actual Bun architecture
        run: bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch'); console.log(process.platform + '/' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

      - run: bun run check

      - run: bun run test

      - run: bun run audit
