name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify the actual Bun architecture
        run: bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch'); console.log(process.platform + '/' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

      - run: bun run check

      - name: Diagnose Windows process startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command node, powershell.exe, conhost.exe | Format-List Source,Version
          node --version
          node -p "process.arch"
          bun -e 'const p=Bun.spawn(["node","-e","console.log(process.execPath,process.arch)"],{stdout:"pipe",stderr:"pipe"}); console.log(await new Response(p.stdout).text(),await new Response(p.stderr).text(),await p.exited)'

      - run: bun run test

      - name: Rehearse native Windows updater recovery
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: bun scripts/rehearse-managed-updates-windows.ts

      - run: bun run audit

  async-answer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Diagnose Windows process startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command node, powershell.exe, conhost.exe | Format-List Source,Version
          node --version
          node -p "process.arch"
          bun -e 'const p=Bun.spawn(["node","-e","console.log(process.execPath,process.arch)"],{stdout:"pipe",stderr:"pipe"}); console.log(await new Response(p.stdout).text(),await new Response(p.stderr).text(),await p.exited)'

      - run: bun run test:async-answer:browser
