name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify the actual Bun architecture
        run: bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch'); console.log(process.platform + '/' + process.arch)"
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

      - run: bun run check

      - run: bun run test

      - name: Verify isolated CLI update and App Server lifecycle
        run: bun scripts/test-provider-cli-updates.ts

      - name: Rehearse native Windows updater recovery
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: bun scripts/rehearse-managed-updates-windows.ts

      - run: bun run audit

  macos-integrations:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            architecture: x64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install pinned public CLIs in an isolated directory
        run: npm install --prefix test-artifacts/macos-cli --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1 @tencent-ai/codebuddy-code@2.180.0
      - name: Verify native Mac integrations with real CLIs and a synthetic model endpoint
        run: |
          bun -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Bun architecture mismatch')"
          node -e "if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Vendor Node architecture mismatch')"
          bun scripts/verify-macos-integrations.ts --run
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}

  async-answer-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run test:async-answer:browser
      - run: bun run test:remote-auth:browser
      - run: bun run test:remote-auth:browser --firefox

  workspace-preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STILLON_PREVIEW_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run check
      - name: Exercise local preview interfaces
        run: bun run test:previews:browser --local-only
      - name: Verify native files with an unavailable host browser
        run: bun run test:previews:browser --local-only --files-only
      - name: Recheck document navigation with Firefox
        run: bun run test:previews:browser --local-only --firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workspace-preview-evidence
          path: |
            test-artifacts/workspace-previews/**/api-results*.json
            test-artifacts/workspace-previews/**/browser-results.json
            test-artifacts/workspace-previews/**/browser-results-*.json
            test-artifacts/workspace-previews/**/*-sidebar.png
            test-artifacts/workspace-previews/**/*-standalone.png
            test-artifacts/workspace-previews/**/*-outside-html.jpg
            test-artifacts/workspace-previews/**/*-recovery-*.jpg

  workspace-preview-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Recheck fresh native service discovery
        run: bun scripts/verify-preview-discovery.ts --scans=30
      - name: Exercise Edge input, drag and service-list interfaces
        run: bun run test:previews:browser --local-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workspace-preview-windows-evidence
          path: |
            test-artifacts/preview-discovery-results.json
            test-artifacts/workspace-previews/**/api-results*.json
            test-artifacts/workspace-previews/**/browser-results*.json
            test-artifacts/workspace-previews/**/*-input-sidebar.png
            test-artifacts/workspace-previews/**/*-input-standalone.png

  settings-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:settings:browser

  artifact-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare nested binary and manifest fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("artifact-source")
          (root / "nested").mkdir(parents=True)
          (root / "nested/runtime.bin").write_bytes(bytes(range(256)) * 4)
          (root / "release.json").write_text('{"schema":1}\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-roundtrip-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-source/
          compression-level: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-roundtrip-*
          merge-multiple: true
          path: artifact-downloaded/
      - name: Verify downloaded paths and bytes
        run: diff --recursive artifact-source/ artifact-downloaded/
